name: Deploy Astro Landing Page site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
      PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
      PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
      PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
      PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.PUBLIC_FIREBASE_MEASUREMENT_ID }}
      PUBLIC_CMS_FUNCTION_BASE_URL: ${{ secrets.PUBLIC_CMS_FUNCTION_BASE_URL }}
      CMS_BUILD_AUTH_TOKEN: ${{ secrets.CMS_BUILD_AUTH_TOKEN }}
      CMS_BUILD_ID_TOKEN: ${{ secrets.CMS_BUILD_ID_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Firebase build env
        run: |
          missing=0
          for key in \
            PUBLIC_FIREBASE_API_KEY \
            PUBLIC_FIREBASE_AUTH_DOMAIN \
            PUBLIC_FIREBASE_PROJECT_ID \
            PUBLIC_FIREBASE_STORAGE_BUCKET \
            PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            PUBLIC_FIREBASE_APP_ID \
            PUBLIC_FIREBASE_MEASUREMENT_ID \
            PUBLIC_CMS_FUNCTION_BASE_URL
          do
            if [ -z "${!key}" ]; then
              echo "::error::$key is missing"
              missing=1
            fi
          done
          exit "$missing"

      - name: Report CMS build auth mode
        run: |
          if [ -n "$CMS_BUILD_AUTH_TOKEN" ]; then
            echo "CMS build auth token configured via CMS_BUILD_AUTH_TOKEN."
          elif [ -n "$CMS_BUILD_ID_TOKEN" ]; then
            echo "CMS build auth token configured via CMS_BUILD_ID_TOKEN."
          else
            echo "::warning::No CMS build auth token configured. Astro may fall back to local CMS JSON if the CMS endpoints require auth."
          fi

      - name: Build site
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
