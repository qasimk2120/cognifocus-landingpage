<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">focus shard single</title>
  <desc id="desc">CogniFocus Focus Shards icon exported from the production symbol artwork.</desc>
  <defs>
    <linearGradient id="fss-shardBodyA" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#a8f7e2"/>
          <stop offset="35%" stop-color="#67eac2"/>
          <stop offset="70%" stop-color="#53c6ff"/>
          <stop offset="100%" stop-color="#3e7cff"/>
        </linearGradient>
        <linearGradient id="fss-shardBodyB" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#e6fff8" stop-opacity="0.9"/>
          <stop offset="30%" stop-color="#8deed5" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#2742a8" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="fss-shardBodyC" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#bdf6e3"/>
          <stop offset="60%" stop-color="#4dd0ff"/>
          <stop offset="100%" stop-color="#8b6bff"/>
        </linearGradient>
        <linearGradient id="fss-shardFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="fss-shardEdge" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#c7a3ff" stop-opacity="0.0"/>
          <stop offset="55%" stop-color="#c7a3ff" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#3e7cff" stop-opacity="1"/>
        </linearGradient>
        <radialGradient id="fss-aura" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#53c6ff" stop-opacity="0.55"/>
          <stop offset="55%" stop-color="#3e7cff" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#8b6bff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="fss-innerGlow" cx="50%" cy="40%" r="55%">
          <stop offset="0%" stop-color="#e6fff8" stop-opacity="0.55"/>
          <stop offset="60%" stop-color="#67eac2" stop-opacity="0"/>
        </radialGradient>
    
        
        <filter id="fss-softGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
        <filter id="fss-hardEdgeGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.2"/>
        </filter>
  </defs>
  <ellipse cx="256" cy="270" rx="150" ry="150" fill="url(#fss-aura)" filter="url(#fss-softGlow)" opacity="0.85"/>
        <g>
          <polygon points="262,72 348,224 308,400 256,448"
                   fill="url(#fss-shardBodyA)"/>
          <polygon points="262,72 256,448 200,360 172,194"
                   fill="url(#fss-shardBodyB)"/>
          <polygon points="262,72 256,448 222,260"
                   fill="url(#fss-shardFacetLight)" opacity="0.5"/>
          <ellipse cx="256" cy="260" rx="62" ry="130" fill="url(#fss-innerGlow)"/>
          <line x1="262" y1="72" x2="256" y2="448" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
          <polyline points="262,72 348,224 308,400 256,448 200,360 172,194 262,72"
                    fill="none" stroke="url(#fss-shardEdge)" stroke-width="2.4" stroke-linejoin="round" opacity="0.95"/>
          <circle cx="262" cy="72" r="4" fill="#ffffff"/>
        </g>
</svg>
