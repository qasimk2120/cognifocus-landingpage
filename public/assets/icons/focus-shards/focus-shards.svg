<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">focus shards</title>
  <desc id="desc">CogniFocus Focus Shards icon exported from the production symbol artwork.</desc>
  <defs>
    <linearGradient id="fs-shardBodyA" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#a8f7e2"/>
          <stop offset="35%" stop-color="#67eac2"/>
          <stop offset="70%" stop-color="#53c6ff"/>
          <stop offset="100%" stop-color="#3e7cff"/>
        </linearGradient>
        <linearGradient id="fs-shardBodyB" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#e6fff8" stop-opacity="0.9"/>
          <stop offset="30%" stop-color="#8deed5" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#2742a8" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="fs-shardBodyC" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#bdf6e3"/>
          <stop offset="60%" stop-color="#4dd0ff"/>
          <stop offset="100%" stop-color="#8b6bff"/>
        </linearGradient>
        <linearGradient id="fs-shardFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="fs-shardEdge" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#c7a3ff" stop-opacity="0.0"/>
          <stop offset="55%" stop-color="#c7a3ff" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#3e7cff" stop-opacity="1"/>
        </linearGradient>
        <radialGradient id="fs-aura" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#53c6ff" stop-opacity="0.55"/>
          <stop offset="55%" stop-color="#3e7cff" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#8b6bff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="fs-innerGlow" cx="50%" cy="40%" r="55%">
          <stop offset="0%" stop-color="#e6fff8" stop-opacity="0.55"/>
          <stop offset="60%" stop-color="#67eac2" stop-opacity="0"/>
        </radialGradient>
    
        
        <filter id="fs-softGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
        <filter id="fs-hardEdgeGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.2"/>
        </filter>
  </defs>
  <!-- soft aura -->
        <ellipse cx="256" cy="276" rx="180" ry="180" fill="url(#fs-aura)" filter="url(#fs-softGlow)" opacity="0.9"/>
        <path d="M 110 360 Q 200 300 256 280 T 410 170"
