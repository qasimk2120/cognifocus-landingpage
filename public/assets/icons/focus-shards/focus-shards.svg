          <line x1="262" y1="68" x2="184" y2="182" stroke="#ffffff" stroke-width="1" opacity="0.45"/>
          <line x1="262" y1="68" x2="340" y2="212" stroke="#ffffff" stroke-width="0.8" opacity="0.35"/>
          <polyline points="262,68 340,212 308,388 256,438 206,360 184,182 262,68"
