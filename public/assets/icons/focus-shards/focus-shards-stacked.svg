<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">focus shards stacked</title>
  <desc id="desc">CogniFocus Focus Shards icon exported from the production symbol artwork.</desc>
  <defs>
    <linearGradient id="fst-shardBodyA" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#a8f7e2"/>
          <stop offset="35%" stop-color="#67eac2"/>
          <stop offset="70%" stop-color="#53c6ff"/>
          <stop offset="100%" stop-color="#3e7cff"/>
        </linearGradient>
        <linearGradient id="fst-shardBodyB" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#e6fff8" stop-opacity="0.9"/>
          <stop offset="30%" stop-color="#8deed5" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#2742a8" stop-opacity="0.95"/>
        </linearGradient>
        <linearGradient id="fst-shardBodyC" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#bdf6e3"/>
          <stop offset="60%" stop-color="#4dd0ff"/>
          <stop offset="100%" stop-color="#8b6bff"/>
        </linearGradient>
        <linearGradient id="fst-shardFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="fst-shardEdge" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#c7a3ff" stop-opacity="0.0"/>
          <stop offset="55%" stop-color="#c7a3ff" stop-opacity="0.8"/>
          <stop offset="100%" stop-color="#3e7cff" stop-opacity="1"/>
        </linearGradient>
        <radialGradient id="fst-aura" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#53c6ff" stop-opacity="0.55"/>
          <stop offset="55%" stop-color="#3e7cff" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#8b6bff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="fst-innerGlow" cx="50%" cy="40%" r="55%">
          <stop offset="0%" stop-color="#e6fff8" stop-opacity="0.55"/>
          <stop offset="60%" stop-color="#67eac2" stop-opacity="0"/>
        </radialGradient>
    
        
        <filter id="fst-softGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
        <filter id="fst-hardEdgeGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="1.2"/>
        </filter>
  </defs>
  <ellipse cx="256" cy="290" rx="200" ry="180" fill="url(#fst-aura)" filter="url(#fst-softGlow)" opacity="0.95"/>
        <g>
          <polygon points="156,148 196,176 188,308 142,254"
                   fill="url(#fst-shardBodyC)" opacity="0.9"/>
          <polygon points="156,148 188,308 142,254"
                   fill="url(#fst-shardFacetLight)" opacity="0.5"/>
          <polyline points="156,148 196,176 188,308 142,254 156,148"
                    fill="none" stroke="url(#fst-shardEdge)" stroke-width="1.4" stroke-linejoin="round" opacity="0.9"/>
        </g>
        <g>
          <polygon points="378,118 420,184 408,288 362,232"
                   fill="url(#fst-shardBodyC)" opacity="0.9"/>
          <polygon points="378,118 408,288 362,232"
                   fill="url(#fst-shardFacetLight)" opacity="0.55"/>
          <polyline points="378,118 420,184 408,288 362,232 378,118"
                    fill="none" stroke="url(#fst-shardEdge)" stroke-width="1.4" stroke-linejoin="round" opacity="0.9"/>
        </g>
        <g>
          <polygon points="262,112 344,256 312,420 256,460"
                   fill="url(#fst-shardBodyA)"/>
          <polygon points="262,112 256,460 208,388 188,224"
                   fill="url(#fst-shardBodyB)"/>
          <polygon points="262,112 256,460 226,290"
                   fill="url(#fst-shardFacetLight)" opacity="0.5"/>
          <ellipse cx="256" cy="300" rx="60" ry="120" fill="url(#fst-innerGlow)"/>
          <line x1="262" y1="112" x2="256" y2="460" stroke="#ffffff" stroke-width="1.4" opacity="0.6"/>
          <polyline points="262,112 344,256 312,420 256,460 208,388 188,224 262,112"
                    fill="none" stroke="url(#fst-shardEdge)" stroke-width="1.6" stroke-linejoin="round" opacity="0.95"/>
          <circle cx="262" cy="112" r="3.4" fill="#ffffff"/>
        </g>
        <g>
          <polygon points="358,256 406,318 386,408 338,360"
                   fill="url(#fst-shardBodyC)"/>
          <polygon points="358,256 338,360 406,318"
                   fill="url(#fst-shardFacetLight)" opacity="0.55"/>
          <polyline points="358,256 406,318 386,408 338,360 358,256"
                    fill="none" stroke="url(#fst-shardEdge)" stroke-width="1.4" stroke-linejoin="round" opacity="0.95"/>
        </g>
        <g fill="#e6fff8">
          <circle cx="110" cy="320" r="2.6" opacity="0.85"/>
          <circle cx="430" cy="332" r="2" opacity="0.7"/>
          <circle cx="120" cy="200" r="1.4" opacity="0.55"/>
          <circle cx="420" cy="430" r="1.6" opacity="0.6"/>
          <circle cx="290" cy="60" r="1.4" opacity="0.55"/>
        </g>
</svg>
